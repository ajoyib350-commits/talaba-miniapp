<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talaba Slayd & Referat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; font-size: 20px; text-align: center; margin-top: 5px; }
        label { display: block; margin: 10px 0 5px; font-size: 14px; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        .btn { width: 100%; background: #38bdf8; color: #0f172a; font-weight: bold; padding: 14px; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; font-size: 16px; }
        .btn:active { background: #0284c7; }
    </style>
</head>
<body>

    <h2>🎓 Talaba Topshiriq Generatori</h2>

    <div class="card">
        <label>Topshiriq Turini Tanlang:</label>
        <select id="docType" onchange="toggleForm()">
            <option value="slayd">📊 Slayd (PPTX)</option>
            <option value="referat">📄 Referat / Mustaqil ish (DOCX)</option>
            <option value="hand">✍️ Qo'l Yozma Topshiriq</option>
        </select>
    </div>

    <!-- Slayd va Referat uchun ma'lumotlar -->
    <div class="card" id="mainForm">
        <label>Mavzu / Sarlavha:</label>
        <input type="text" id="title" placeholder="Masalan: Axborot xavfsizligi">
        
        <label>Talaba haqida ma'lumot:</label>
        <input type="text" id="student" placeholder="Ism Familiya, Guruh">
    </div>

    <!-- Qo'l yozisi va Font tanlash bo'limi -->
    <div class="card" id="fontSection" style="display:none;">
        <label>Yozuv Uslubi va Fontini Tanlang:</label>
        <select id="fontStyle">
            <option value="hand_1">✍️ Qo'l yozisi 1 (Tartibli latofatli)</option>
            <option value="hand_2">✍️ Qo'l yozisi 2 (Erkin yozuv)</option>
            <option value="hand_3">✍️ Qo'l yozisi 3 (Mayda va zich)</option>
            <option value="hand_4">✍️ Qo'l yozisi 4 (Qalin va to'g'ri)</option>
            <option value="printed">🖨️ Bosma Yozuv (Times / Arial)</option>
        </select>
    </div>

    <div class="card">
        <label>Matn / Mazmun:</label>
        <textarea id="content" rows="6" placeholder="Topshiriq matnini shu yerga kiriting..."></textarea>
        
        <button class="btn" onclick="sendData()">Yuborish va Yaratish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function toggleForm() {
            const type = document.getElementById('docType').value;
            document.getElementById('fontSection').style.display = (type === 'hand') ? 'block' : 'none';
        }

        function sendData() {
            const payload = {
                user_id: tg.initDataUnsafe?.user?.id || 123456,
                doc_type: document.getElementById('docType').value,
                title: document.getElementById('title').value,
                student: document.getElementById('student').value,
                font_style: document.getElementById('fontStyle').value,
                content: document.getElementById('content').value,
                topics: [{header: "Kirish", content: document.getElementById('content').value}]
            };

            fetch('https://YOUR_SERVER_URL/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(() => {
                tg.close();
            }).catch(err => {
                alert("Xatolik yuz berdi: " + err);
            });
        }
    </script>
</body>
</html>
